  - dependency_id: workflow_completion_verification
    type: decision
    dependency_scope: workflow
    name: Workflow Completion Check
    description: "Final verification that all workflow outputs (plan.md, solution.py, implementation.md, review.md) exist and python3 solution.py passes"
    resource_type: decision
    location: null
    producer_role: reviewer
    consumers: []
    prerequisites:
