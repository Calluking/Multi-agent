schema_version: "0.1"
task_summary: "Build SportsTeamCollaborator web platform for multi-agent sports match data analysis"
dependencies:
  - dependency_id: plan_artifact
    type: artifact
    dependency_scope: workflow
    name: Design Plan
    description: "Architecture plan produced by planner covering all requirements, component design, deterministic tests, and edge cases for SportsTeamCollaborator"
    resource_type: file
    location: plan.md
    producer_role: planner
    consumers:
      - role: implementer
        intended_action: read plan and implement code
    prerequisites: []
    expected_state: produced
    acceptance_criteria:
      - criterion_id: plan_exists
        type: existence
        specification: "plan.md exists and is non-empty"
        values: []
      - criterion_id: plan_covers_architecture
        type: content_contains_all
        specification: "plan.md must contain architecture design"
        values: ["architecture"]
      - criterion_id: plan_covers_requirements
        type: content_contains_all
        specification: "plan.md must cover user roles, data upload, real-time collaboration, tests, and edge cases"
        values: ["role", "upload", "collaboration", "test", "edge case"]
      - criterion_id: plan_no_implementation
        type: semantic
        specification: "plan.md must not contain implemented code, only design"
        values: []
    verification:
      method: inspection
      command: null
      expected: {}
      timeout_seconds: null
    deadline: before_consumer_start
    deadline_stage: planning
    recovery_role: planner
    next_action: "Write plan.md with architecture, requirements, test strategy, and edge case analysis"
    semantic_text: "Architecture plan for SportsTeamCollaborator covering all requirements and design decisions"
    keywords: ["plan", "design", "architecture", "requirements"]
    entities: ["SportsTeamCollaborator", "plan.md"]
    applicable_actions: ["run_planning", "read_plan"]
    applicable_stages: ["planning", "implementation"]
    priority: critical
    confidence: 0.95
    evidence:
      - source: workflow
        text: "Produce plan.md covering architecture, all requirements, dependencies, deterministic tests, and edge cases"

  - dependency_id: solution_code
    type: artifact
    dependency_scope: product
    name: SportsTeamCollaborator Implementation
    description: "Complete self-contained solution.py implementing SportsTeamCollaborator with user roles, data upload, real-time collaboration, performance metrics, reports, tests, and security"
    resource_type: file
    location: solution.py
    producer_role: implementer
    consumers:
      - role: reviewer
        intended_action: inspect and verify implementation
    prerequisites:
      - dependency_id: plan_artifact
        relation: requires
        required_state: produced
    expected_state: produced
    acceptance_criteria:
      - criterion_id: solution_exists
        type: existence
        specification: "solution.py exists and is non-empty"
        values: []
      - criterion_id: solution_user_role
        type: semantic
        specification: "solution.py implements role-based access for coaches, analysts, and players"
        values: []
      - criterion_id: solution_data_upload
        type: semantic
        specification: "solution.py implements data upload for video, CSV, and live data streams"
        values: []
      - criterion_id: solution_collaboration
        type: semantic
        specification: "solution.py implements real-time shared notes, comments, and chat"
        values: []
      - criterion_id: solution_performance_metrics
        type: semantic
        specification: "solution.py implements performance metric calculations and report generation"
        values: []
      - criterion_id: solution_test_suite
        type: semantic
        specification: "solution.py includes deterministic tests covering upload, roles, collaboration, metrics, and edge cases"
        values: []
      - criterion_id: solution_executable
        type: execution
        specification: "python3 solution.py exits successfully (exit code 0)"
        values: []
    verification:
      method: execution
      command: python3 solution.py
      expected: {"exit_code": 0}
      timeout_seconds: 120
    deadline: before_consumer_start
    deadline_stage: implementation
    recovery_role: implementer
    next_action: "Create solution.py with complete SportsTeamCollaborator system and deterministic test suite"
    semantic_text: "Self-contained SportsTeamCollaborator Python implementation with roles, uploads, collaboration, metrics, tests, and security"
    keywords: ["implementation", "code", "SportsTeamCollaborator", "solution"]
    entities: ["SportsTeamCollaborator", "solution.py", "coach", "analyst", "player"]
    applicable_actions: ["run_implementation", "read_code", "verify_tests"]
    applicable_stages: ["implementation", "review"]
    priority: critical
    confidence: 0.95
    evidence:
      - source: task
        text: "Write a system called SportsTeamCollaborator that facilitates collaborative analysis of sports match data"
      - source: workflow
        text: "Create a complete self-contained solution.py with deterministic executable tests"

  - dependency_id: implementation_log
    type: artifact
    dependency_scope: workflow
    name: Implementation Report
    description: "implementation.md containing the exact command run and result from implementer verification"
    resource_type: file
    location: implementation.md
    producer_role: implementer
    consumers:
      - role: reviewer
        intended_action: read implementation results before review
    prerequisites:
      - dependency_id: solution_code
        relation: requires
        required_state: produced
    expected_state: produced
    acceptance_criteria:
      - criterion_id: impl_log_exists
        type: existence
        specification: "implementation.md exists and is non-empty"
        values: []
      - criterion_id: impl_log_command
        type: content_contains_all
        specification: "implementation.md must contain the command and result from test execution"
        values: ["python3", "solution.py"]
    verification:
      method: inspection
      command: null
      expected: {}
      timeout_seconds: null
    deadline: before_consumer_start
    deadline_stage: implementation
    recovery_role: implementer
    next_action: "Write implementation.md with the execution command and output"
    semantic_text: "Log of implementation verification run showing test command and result"
    keywords: ["implementation", "log", "test", "verification"]
    entities: ["implementation.md"]
    applicable_actions: ["run_implementation", "read_report"]
    applicable_stages: ["implementation", "review"]
    priority: medium
    confidence: 0.9
    evidence:
      - source: workflow
        text: "Write implementation.md containing the exact command and result"

  - dependency_id: review_artifact
    type: artifact
    dependency_scope: workflow
    name: Review Report
    description: "review.md produced by reviewer containing verification results, any repairs made, and reviewer-added tests"
    resource_type: file
    location: review.md
    producer_role: reviewer
    consumers: []
    prerequisites:
      - dependency_id: solution_code
        relation: requires
        required_state: produced
      - dependency_id: implementation_log
        relation: requires
        required_state: produced
    expected_state: produced
    acceptance_criteria:
      - criterion_id: review_exists
        type: existence
        specification: "review.md exists and is non-empty"
        values: []
      - criterion_id: review_verified
        type: execution
        specification: "reviewer ran python3 solution.py and it passed"
        values: []
    verification:
      method: inspection
      command: null
      expected: {}
      timeout_seconds: null
    deadline: before_workflow_completion
    deadline_stage: review
    recovery_role: reviewer
    next_action: "Run python3 solution.py, inspect code, repair issues, add tests, and write review.md"
    semantic_text: "Review verification report for SportsTeamCollaborator covering code inspection and test rerun"
    keywords: ["review", "verification", "report"]
    entities: ["solution.py", "review.md"]
    applicable_actions: ["run_review", "read_report"]
    applicable_stages: ["review"]
    priority: medium
    confidence: 0.9
    evidence:
      - source: workflow
        text: "Run python3 solution.py, repair solution.py when needed, add reviewer tests where useful, rerun verification, and write review.md"

  - dependency_id: python_runtime
    type: capability
    dependency_scope: environment
    name: Python 3 Runtime
    description: "Python 3 interpreter available on the environment to execute solution.py"
    resource_type: other
    location: null
    producer_role: environment
    consumers:
      - role: implementer
        intended_action: run python3 solution.py for verification
      - role: reviewer
        intended_action: run python3 solution.py for verification
    prerequisites: []
    expected_state: available
    acceptance_criteria:
      - criterion_id: python_available
        type: execution
        specification: "python3 --version succeeds"
        values: []
    verification:
      method: execution
      command: python3 --version
      expected: {}
      timeout_seconds: 30
    deadline: before_consumer_start
    deadline_stage: implementation
    recovery_role: environment
    next_action: "Install Python 3 on the environment"
    semantic_text: "Python 3 runtime environment for executing solution.py"
    keywords: ["python", "runtime", "environment"]
    entities: ["python3"]
    applicable_actions: ["run_implementation", "run_review", "verify_tests"]
    applicable_stages: ["implementation", "review"]
    priority: critical
    confidence: 0.99
    evidence:
      - source: workflow
        text: "Run python3 solution.py and repair failures"

